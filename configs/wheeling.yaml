# Green Energy Wheeling Allocation Optimization Configuration
# 綠電轉供配置最佳化

instance:
  # Problem size (Phase 0/1: small instance)
  n_generators: 5        # m: PV/wind plants
  n_consumers: 10        # n: corporate buyer sites
  n_days: 30             # billing month

  generators:
    solar:
      capacity_range_kw: [500, 5000]    # kW nameplate
      ppa_price_range: [3.5, 5.0]       # NTD/kWh
      fraction: 0.7                      # 70% solar, 30% wind
    wind:
      capacity_range_kw: [2000, 10000]
      ppa_price_range: [5.0, 7.0]

  consumers:
    demand_peak_range_kw: [100, 2000]    # peak demand kW
    contract_coverage_range: [0.3, 0.8]  # fraction of demand under green contract
    re100_target_range: [0.5, 1.0]       # RE100 fulfillment target
    retail_price_range: [4.5, 7.5]       # NTD/kWh (green premium, above PPA)

  market:
    surplus_price: 1.0          # NTD/kWh (penalty for undelivered generation)
    wheeling_fee: 0.75          # NTD/kWh (Taipower grid usage fee)
    fairness_tolerance: 0.15    # α: max deviation from proportional allocation
    re100_penalty_weight: 2.0   # λ: RE100 shortfall weight in TMI

# Solar profile generation (pvlib)
solar:
  latitude: 24.0
  longitude: 120.5
  timezone: "Asia/Taipei"
  cloud_cover_beta_a: 2.0      # Beta(a, b) for cloud cover
  cloud_cover_beta_b: 5.0      # a=2, b=5 → mostly clear

# Wind profile generation (Weibull)
wind:
  weibull_k: 2.0               # shape parameter (k=2 ≈ Rayleigh)
  weibull_c_range: [7.0, 9.0]  # scale parameter range (m/s)
  cut_in_speed: 3.0
  rated_speed: 12.0
  cut_out_speed: 25.0
  autocorrelation: 0.95        # AR(1) temporal correlation

# NSGA-II optimization
optimization:
  algorithm: "nsga2"
  population_size: 100
  n_generations: 200
  crossover:
    type: "sbx"
    prob: 0.9
    eta: 20
  mutation:
    type: "polynomial"
    eta: 20
  min_weight_threshold: 0.01   # snap w_{ij} < 0.01 to 0
  seed: 42
